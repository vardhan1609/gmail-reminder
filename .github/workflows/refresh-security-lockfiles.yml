name: Refresh security lockfiles

on:
  push:
    branches:
      - security/harden-v01-v18

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-v01-v18
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve and write npm lockfiles
        run: |
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update sharp --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ../whatsapp-bridge
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json whatsapp-bridge/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are up to date."
          else
            git commit -m "security: refresh patched npm dependency lockfiles"
            git push origin HEAD:security/harden-v01-v18
          fi
