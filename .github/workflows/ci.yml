name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gmail_user
          POSTGRES_PASSWORD: gmail_password
          POSTGRES_DB: gmail_reminder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pip-audit

      - name: Audit Python dependencies
        run: |
          cd backend
          pip-audit -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run backend automated test suite
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-32-chars-long-here
        run: |
          cd backend
          pytest -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Build Next.js production bundle
        run: |
          cd frontend
          npm run build

  whatsapp-bridge-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: whatsapp-bridge/package-lock.json

      - name: Install WhatsApp bridge dependencies
        run: |
          cd whatsapp-bridge
          npm ci --omit=dev

      - name: Audit WhatsApp bridge dependencies
        run: |
          cd whatsapp-bridge
          npm audit --omit=dev --audit-level=high

